name: test

on:
  push:
    branches: [master, 'research/dependencies/**']

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Configure native tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build native tests
        run: cmake --build build --parallel 2 --target demos demos_static commit_test shamir_test crypto_test merkle_test
      - name: Run native tests
        run: |
          for suite in commit shamir crypto merkle; do
            "./build/__tests__/${suite}_test"
          done
